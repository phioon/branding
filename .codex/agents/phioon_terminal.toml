authorize deployment or cleanup.
Return the exact checked revision and separate implementation, tests/review, push,
PR readiness, merge, deployment and cleanup evidence; state blockers and next actions.
Provide companion-repo dependencies and merge/deployment order for the PR handoff.
"""
