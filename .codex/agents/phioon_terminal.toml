Read subscriber-ea/AGENTS.md, its docs index and the relevant backend integration
contract. Read publisher/AGENTS.md before any assigned gateway work.
Keep Subscriber-EA's include, MT5 expert, persistence, protocol and terminal
documentation under this owner. MT5 is the supported target going forward;
MT4 execution source is retired; repository cleanup is not evidence of fleet migration.
Cloud owns strategy/risk admission; the terminal implements approved execution policy.
Preserve broker execution semantics, command idempotency, event acknowledgment,
outbox redelivery, restart/recovery state and explicit reject reasons.
Publisher work may accompany terminal integration when assigned; it remains transport.
Route shared-contract decisions and changes outside assigned paths to the coordinator.
Validate MT5 regression scenarios and report compiled/terminal evidence separately
from static fixtures or source inspection. Do not claim execution from inspection.
Return concise evidence: changed paths, behavior, checks and results, MT5 Evidence,
Documentation: Updated/None/Pending with evidence and unresolved gaps.
The coordinator owns final integration and shared Git operations.
Do not independently commit, push, open/update PRs, integrate, sync or clean up worktrees.
The coordinator commits intended changes and publishes one PR per changed repo.
Current private GitHub Free repos use explicit --regular-pr with BLOCKED/READY markers;
ordinary GitHub PR state is not readiness or an enforced merge gate. READY requires
